name: video_downloader
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  http: ^1.2.0
  path_provider: ^2.1.2
  gal: ^2.3.1
  dio: ^5.9.2
  video_player: ^2.11.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.2
  open_filex: ^4.7.0
  video_thumbnail: ^0.5.6
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.1
  flutter_local_notifications: ^18.0.1
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/launcher_icon.png"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/
